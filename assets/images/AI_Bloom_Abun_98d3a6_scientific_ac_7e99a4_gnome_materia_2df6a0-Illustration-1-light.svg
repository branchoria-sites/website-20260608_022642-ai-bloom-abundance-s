:root {
    --background: #f8fafc;
    --panel: #ffffff;
    --primary-text: #0f172a;
    --muted-text: #64748b;
    --inverse-text: #ffffff;
    --border: #e2e8f0;
    --shadow-color: #000000;
    --icon-pad-bg: #1e293b;
    --art-glow: #0891b2;
    --art-glow-opacity: 0.10;
    --art-sheen: #ffffff;
    --art-sheen-opacity: 0.34;
    --art-shadow: #0f172a;
    --art-shadow-opacity: 0.14;
    --art-muted-line: #94a3b8;
    --art-panel-tint: #f1f5f9;
    --font-family: 'Inter', 'Segoe UI', 'Kalam', Roboto, Helvetica, Arial, sans-serif;
    --radius-xl: 16px;
    --font-family-headline: 'Inter', 'Segoe UI', 'Kalam', Roboto, Helvetica, Arial, sans-serif;
    --font-family-body: 'Inter', 'Segoe UI', 'Kalam', Roboto, Helvetica, Arial, sans-serif;
    --font-heading: 'Inter', 'Segoe UI', 'Kalam', Roboto, Helvetica, Arial, sans-serif;
    --font-body: 'Inter', 'Segoe UI', 'Kalam', Roboto, Helvetica, Arial, sans-serif;
    --font-size-h1: 56px;
    --font-size-h2: 40px;
    --font-size-h3: 28px;
    --font-size-body: 24px;
    --font-size-caption: 18px;
    --secondary-text: var(--muted-text);
    --panel-border: var(--border);
    --font-weight-normal: 400;
    --font-weight-medium: 500;
    --font-weight-semibold: 600;
    --font-weight-bold: 700;
    --spacing-gutter-pct: 0.07;
    --spacing-top-pct: 0.15;
    --spacing-bottom-pct: 0.07;
    --spacing-title-y-pct: 0.055;
    --accent-1: #0891b2;
    --accent-2: #db2777;
    --accent-3: #ca8a04;
    --accent-4: #65a30d;
    --accent-5: #ea580c;
    --accent-6: #9333ea;
}
:root[data-theme="dark"] {
    --background: #0f172a;
    --panel: #1e293b;
    --primary-text: #f1f5f9;
    --muted-text: #94a3b8;
    --inverse-text: #0f172a;
    --border: #334155;
    --shadow-color: #000000;
    --icon-pad-bg: #1e293b;
    --art-glow: #7dd3fc;
    --art-glow-opacity: 0.18;
    --art-sheen: #ffffff;
    --art-sheen-opacity: 0.18;
    --art-shadow: #000000;
    --art-shadow-opacity: 0.28;
    --art-muted-line: #64748b;
    --art-panel-tint: #1e293b;
    --accent-1: #22d3ee;
    --accent-2: #f472b6;
    --accent-3: #facc15;
    --accent-4: #a3e635;
    --accent-5: #fb923c;
    --accent-6: #c084fc;
}
:root[data-theme="light"] {
    --background: #f8fafc;
    --panel: #ffffff;
    --primary-text: #0f172a;
    --muted-text: #64748b;
    --inverse-text: #ffffff;
