<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-theme="light">
  <style>
        @font-face {
            font-family: 'Inter';
            src: url('assets/fonts/Inter-Regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Inter';
            src: url('assets/fonts/Inter-Bold.ttf') format('truetype');
            font-weight: 600;
            font-style: normal;
